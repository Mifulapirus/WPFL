; PlatformIO Project Configuration File
;
; WPFL Arena LED Driver — runs on the Rotato controller PCB (ESP32-C3 Super Mini)
; Based on the Rotato firmware by Angel Hernandez (www.thehomelab.dev)
;
; Build:     pio run
; Flash:     pio run --target upload
; Monitor:   pio device monitor
;
; The web UI (ui/index.html) is gzip-embedded into the firmware by
; scripts/embed_web_ui.py — no "uploadfs" step is needed.
;
; https://docs.platformio.org/page/projectconf.html

[env:arena-led]
; Pinned so the build is reproducible (arduino-esp32 2.0.17 / ESP-IDF 4.4).
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; ── Partition table ──────────────────────────────────────────────────────────
; min_spiffs.csv: two 1.9 MB OTA app slots (for POST /update) + small data.
board_build.partitions = min_spiffs.csv

; ── Build scripts (same pipeline as Rotato) ─────────────────────────────────
;   auto_version.py  — writes src/version_build.h, bumps build_number.txt
;   embed_web_ui.py  — gzips ui/index.html into src/web_ui_html.h
;   copy_firmware.py — copies the .bin to bin/wpfl-arena-led-<version>.bin
extra_scripts =
    pre:scripts/auto_version.py
    pre:scripts/embed_web_ui.py
    post:scripts/copy_firmware.py

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    ; ESP-IDF log level: 0=None 1=Error 2=Warn 3=Info. Firmware logs use Serial.
    -DCORE_DEBUG_LEVEL=1
    ; ESP32-C3 Super Mini: Serial → native USB-CDC (the USB-C port).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Cap per-client WebSocket send queue so a slow/stalled client cannot
    ; eat the heap (library default is 32 messages).
    -DWS_MAX_QUEUED_MESSAGES=16

; ── Libraries ───────────────────────────────────────────────────────────────
; ESPAsyncWebServer — async HTTP + WebSocket (pulls in AsyncTCP)
; ArduinoJson       — JSON protocol (v7 API: JsonDocument)
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.10.3
    bblanchon/ArduinoJson @ ^7.3.1
; (WS2811 output uses the IDF SPI master driver + DMA — see src/led/LedOutput.h)
