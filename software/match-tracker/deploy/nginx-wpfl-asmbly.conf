# nginx site for the WPFL match tracker on Capek-Web (app on 127.0.0.1:3110 under PM2).
# HTTP-only on purpose: certbot adds the 443/TLS parts, like the other thehomelab.dev sites.
#   sudo cp deploy/nginx-wpfl-asmbly.conf /etc/nginx/sites-available/wpfl-asmbly.thehomelab.dev.conf
#   sudo ln -sf /etc/nginx/sites-available/wpfl-asmbly.thehomelab.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wpfl-asmbly.thehomelab.dev --redirect
# The LED driver trusts the Let's Encrypt roots (ISRG X1/X2/YE/YR) — keep the cert on Let's Encrypt.
server {
    server_name wpfl-asmbly.thehomelab.dev;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: /ws (browsers) and /led (arena LED driver uplink)
    location ~ ^/(ws|led)$ {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    listen 80;
}
